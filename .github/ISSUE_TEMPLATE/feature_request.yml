name: Feature request
description: Suggest something BlipBridge should do
title: "Feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Worth knowing before you write, because these come up often and the
        answers are measured rather than arbitrary:

        - **Images cannot be mutated in place.** No Office export writes to an
          existing cached image, and it is content-addressed by a unique ID.
          Changing content means a new texture. See `docs/pixel_textures.md`.
        - **Batch apply is not faster.** Measured at 10/50/100/200 Shapes it
          lands within noise of the same number of individual calls, because
          each Shape costs ~190 µs of real work. See `docs/c_abi.md`.
        - **A new Shape class needs validation, not a list edit.** Structural
          validity is not enough — a Connector passes every structural check and
          crashes PowerPoint. See `docs/safety_model.md`.
        - **A new Office build needs re-validation** against a real install.
          Use the unsupported-build template for that.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workload, not the API you have in mind. It often changes the answer.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like BlipBridge to do
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: What you are doing today instead
    validations:
      required: false
