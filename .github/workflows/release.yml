name: release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing SemVer tag to release, e.g. v0.4.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: resolve release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag"
            echo "Expected something like v0.4.0"
            exit 1
          fi

          if ! git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag does not exist: $tag"
            exit 1
          fi

          version="${tag#v}"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo "Tag:     $tag"
          echo "Version: $version"

  build:
    name: windows-${{ matrix.arch }}
    needs: metadata
    runs-on: windows-latest

    strategy:
      fail-fast: true

      matrix:
        include:
          - arch: x64
            msystem: UCRT64
            dll_name: BlipBridge-x64.dll
            machine: pei-x86-64
            packages: >-
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-make

          - arch: x86
            msystem: MINGW32
            dll_name: BlipBridge-x86.dll
            machine: pei-i386
            packages: >-
              mingw-w64-i686-gcc
              mingw-w64-i686-cmake
              mingw-w64-i686-make

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0

      - name: Install MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Configure Release
        shell: msys2 {0}
        run: |
          cmake \
            -S . \
            -B build/Release \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBLIPBRIDGE_ARCH=${{ matrix.arch }}

      - name: Build Release
        shell: msys2 {0}
        run: |
          cmake \
            --build build/Release \
            --parallel

      - name: Configure Debug
        shell: msys2 {0}
        run: |
          cmake \
            -S . \
            -B build/Debug \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBLIPBRIDGE_ARCH=${{ matrix.arch }}

      - name: Build Debug
        shell: msys2 {0}
        run: |
          cmake \
            --build build/Debug \
            --parallel

      - name: Test Release
        shell: msys2 {0}
        run: |
          ctest \
            --test-dir build/Release \
            --output-on-failure

      - name: Test Debug
        shell: msys2 {0}
        run: |
          ctest \
            --test-dir build/Debug \
            --output-on-failure

      - name: Locate release DLL
        id: dll
        shell: pwsh
        run: |
          $expected = Join-Path `
              "build/Release" `
              "${{ matrix.dll_name }}"

          $legacy = Join-Path `
              "build/Release" `
              "BlipBridge.dll"

          if (Test-Path $expected) {
              $dll = $expected
          }
          elseif (Test-Path $legacy) {
              Write-Host `
                  "CMake still emitted BlipBridge.dll; normalizing release filename."

              Copy-Item `
                  $legacy `
                  $expected

              $dll = $expected
          }
          else {
              throw "BlipBridge DLL was not produced."
          }

          "path=$dll" >> $env:GITHUB_OUTPUT

          Write-Host "Native library: $dll"

      - name: Verify binary architecture
        shell: msys2 {0}
        run: |
          set -euo pipefail

          dll="${{ steps.dll.outputs.path }}"

          machine=$(
            objdump -f "$dll" |
            grep -o 'pei-i386\|pei-x86-64' |
            head -n 1
          )

          echo "Expected: ${{ matrix.machine }}"
          echo "Actual:   $machine"

          if [ "$machine" != "${{ matrix.machine }}" ]; then
            echo "Architecture mismatch."
            exit 1
          fi

      - name: Verify exported ABI
        shell: msys2 {0}
        run: |
          set -euo pipefail

          dll="${{ steps.dll.outputs.path }}"

          exports="$(
            objdump -p "$dll" |
            sed -n '/Export Address Table/,$p'
          )"

          required=(
            BB_Init
            BB_Shutdown
            BB_GetAbiVersion
            BB_LoadTexture
            BB_LoadTexturePixels
            BB_ApplyTexture
            BB_ApplyTextureBatch
            BB_ApplyTextureIfChanged
            BB_ApplyTextureRange
            BB_ReleaseTexture
            BB_ClearTextures
            BB_ApplyPicture
            BB_InvalidateShape
            BB_ClearPictureCache
            BB_GetPictureCacheStats
            BB_GetTextureCount
            BB_GetCapabilities
            BB_GetLastError
            BB_GetVersion
            BB_GetVersionString
            BB_LoadTexturePixelsScaled
          )

          for symbol in "${required[@]}"; do
            if ! grep -q "$symbol" <<< "$exports"; then
              echo "Missing required export: $symbol"
              exit 1
            fi
          done

          echo "Required C ABI exports found."

      - name: Verify the ABI version
        shell: bash
        run: |
          set -euo pipefail

          # The DLL cannot be asked without loading it, so the header is the
          # authority and the wrapper must agree with it. A mismatch would make
          # every user's Initialize fail for a reason nobody could act on.
          header_abi="$(grep -oP '#define\s+BB_ABI_VERSION\s+\K\d+' include/blipbridge/blipbridge.h)"
          wrapper_abi="$(grep -oP 'BB_EXPECTED_ABI\s+As\s+Long\s+=\s+\K\d+' vba/BlipBridge.bas)"

          echo "header ABI  : $header_abi"
          echo "wrapper ABI : $wrapper_abi"

          if [ "$header_abi" != "4" ]; then
            echo "This release requires ABI 4, header says $header_abi"
            exit 1
          fi

          if [ "$header_abi" != "$wrapper_abi" ]; then
            echo "ABI mismatch between the header and BlipBridge.bas"
            exit 1
          fi

      - name: Verify the public VBA API stayed typed
        shell: pwsh
        run: |
          $wrapper = Get-Content "vba/BlipBridge.bas" -Raw

          # Object or Variant in a public signature would compile and quietly
          # undo the typed API, so it fails the release rather than shipping.
          $publicLines = $wrapper -split "`r?`n" | Where-Object {
              $_ -match '^\s*Public\s+(Function|Sub)\s'
          }

          foreach ($line in $publicLines) {
              if ($line -match '\bAs\s+(Object|Variant)\b') {
                  throw "Public API regressed to Object/Variant: $line"
              }
          }

          foreach ($name in @('BlipBridgeTexture', 'BlipBridgeScaleFilter',
                              'LoadTexturePixelsScaled', 'PowerPoint.ShapeRange')) {
              if ($wrapper -notmatch [regex]::Escape($name)) {
                  throw "BlipBridge.bas is missing $name"
              }
          }

          Write-Host "Public VBA API is strongly typed."

      - name: Verify ABI 4 exposes the range API and its capability
        shell: pwsh
        run: |
          <#
            A release claiming ABI 4 must actually carry what ABI 4 means:
            BB_ApplyTextureRange in the header and the wrapper, and the
            capability bit that advertises it. Otherwise a caller checks the
            capability, gets nothing, and has no way to tell why.
          #>
          $header = Get-Content "include/blipbridge/blipbridge.h" -Raw
          $wrapper = Get-Content "vba/BlipBridge.bas" -Raw

          if ($header -notmatch '#define\s+BB_ABI_VERSION\s+(\d+)u') {
              throw "Could not read BB_ABI_VERSION from the public header."
          }
          $abi = [int]$Matches[1]
          if ($abi -lt 4) {
              throw "This release requires ABI 4 or later, header says $abi."
          }

          if ($header -notmatch '#define\s+BB_CAP_RANGE_APPLY\s+0x0100u') {
              throw "BB_CAP_RANGE_APPLY must be defined as 0x0100u."
          }

          foreach ($required in @('BB_ApplyTextureRange')) {
              if ($header -notmatch [regex]::Escape($required)) {
                  throw "The public header is missing $required."
              }
          }

          foreach ($required in @('ApplyTextureRange', 'BB_CAP_RANGE_APPLY')) {
              if ($wrapper -notmatch [regex]::Escape($required)) {
                  throw "BlipBridge.bas is missing $required."
              }
          }

          Write-Host "ABI $abi exposes BB_ApplyTextureRange and BB_CAP_RANGE_APPLY (0x0100)."

          <#
            And the version the DLL reports must be the version being tagged.
            A v0.6.0 archive whose BB_GetVersionString says 0.5.0 is a support
            question nobody can answer from the artefacts alone.
          #>
          $expected = "${{ needs.metadata.outputs.version }}"
          $parts = @{}
          foreach ($field in 'MAJOR', 'MINOR', 'PATCH') {
              if ($header -notmatch "#define\s+BB_VERSION_$field\s+(\d+)") {
                  throw "Could not read BB_VERSION_$field from the public header."
              }
              $parts[$field] = $Matches[1]
          }
          $headerVersion = "$($parts['MAJOR']).$($parts['MINOR']).$($parts['PATCH'])"

          if ($headerVersion -ne $expected) {
              throw "Tag is v$expected but the header says $headerVersion."
          }

          Write-Host "Header version $headerVersion matches the tag."

      - name: Verify VBA wrapper architecture names
        shell: pwsh
        run: |
          $wrapper = Get-Content `
              "vba/BlipBridge.bas" `
              -Raw

          if ($wrapper -notmatch 'BlipBridge-x64\.dll') {
              throw "BlipBridge.bas does not reference BlipBridge-x64.dll"
          }

          if ($wrapper -notmatch 'BlipBridge-x86\.dll') {
              throw "BlipBridge.bas does not reference BlipBridge-x86.dll"
          }

          Write-Host `
              "VBA wrapper knows both architecture-specific DLL names."

      # The release ships one universal archive, so each job contributes only
      # its DLL and the packaging happens once, where both are present.
      - name: Upload the built DLL
        uses: actions/upload-artifact@v4
        with:
          name: dll-${{ matrix.arch }}
          if-no-files-found: error
          path: ${{ steps.dll.outputs.path }}

  publish:
    name: publish release
    needs:
      - metadata
      - build

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0

      - name: Download the built DLLs
        uses: actions/download-artifact@v4
        with:
          path: staged
          pattern: dll-*
          merge-multiple: true

      - name: Inspect staged artifacts
        shell: bash
        run: |
          set -euo pipefail
          find staged -maxdepth 2 -type f -print

      - name: Build the universal Windows package
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.metadata.outputs.version }}"
          name="blipbridge-v${version}-windows"

          for dll in BlipBridge-x64.dll BlipBridge-x86.dll; do
            if [ ! -f "staged/$dll" ]; then
              echo "::error::Missing $dll - the ${dll#BlipBridge-} build job did not produce it."
              find staged -type f -print
              exit 1
            fi
          done

          # Only files named here go in. Nothing is copied by pattern, so no
          # build output, research DLL, experiment or test fixture can arrive by
          # accident.
          mkdir -p "universal/$name/docs"
          cp staged/BlipBridge-x64.dll "universal/$name/"
          cp staged/BlipBridge-x86.dll "universal/$name/"
          cp vba/BlipBridge.bas        "universal/$name/"
          cp include/blipbridge/blipbridge.h "universal/$name/"
          cp README.md                 "universal/$name/"
          cp LICENSE                   "universal/$name/"
          cp CHANGELOG.md              "universal/$name/"

          for doc in c_abi.md picture_cache.md resampling.md \
                     shape_compatibility.md safety_model.md \
                     benchmarks.md windows_x86.md; do
            if [ -f "docs/$doc" ]; then
              cp "docs/$doc" "universal/$name/docs/"
            fi
          done

          ( cd universal && zip -9 -r "../staged/${name}.zip" "$name" )

      - name: Verify the archive contents
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.metadata.outputs.version }}"
          name="blipbridge-v${version}-windows"
          listing="$(unzip -Z1 "staged/${name}.zip")"
          echo "$listing"

          for required in "$name/BlipBridge-x64.dll" "$name/BlipBridge-x86.dll" \
                          "$name/BlipBridge.bas" "$name/README.md" "$name/LICENSE"; do
            if ! grep -qxF "$required" <<< "$listing"; then
              echo "::error::Package is missing $required"
              exit 1
            fi
          done

          # Anything from the build tree or the research surface is a packaging
          # bug, not a cosmetic one: the shipped DLL is what runs in someone's
          # PowerPoint.
          if grep -Eq 'BlipBridgeResearch|experiments/|CMakeFiles|\.(obj|o|ilk|exp|lib)$' <<< "$listing"; then
            echo "::error::Package contains build or research artefacts"
            exit 1
          fi

          echo "Archive contents verified."

      - name: Checksum the archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          ( cd staged && sha256sum "blipbridge-v${version}-windows.zip" \
              > "blipbridge-v${version}-windows.zip.sha256" )

      - name: Combine checksums
        shell: bash
        run: |
          set -euo pipefail

          rm -f staged/SHA256SUMS.txt

          ( cd staged && sha256sum *.zip > SHA256SUMS.txt )

          cat staged/SHA256SUMS.txt

      - name: Assemble release notes
        shell: bash
        run: |
          cp \
            .github/release-notes-preamble.md \
            notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          assets=(
            staged/*.zip \
            staged/*.zip.sha256 \
            staged/SHA256SUMS.txt
          )

          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null; then
            # Keep existing notes and release settings when retrying publication.
            gh release upload "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --clobber \
              "${assets[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --verify-tag \
              --title "BlipBridge $RELEASE_TAG" \
              --notes-file notes.md \
              --generate-notes \
              "${assets[@]}"
          fi
