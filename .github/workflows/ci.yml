name: ci

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: windows-${{ matrix.arch }}-${{ matrix.configuration }}

    runs-on: windows-latest

    strategy:
      fail-fast: false

      matrix:
        configuration:
          - Release
          - Debug

        include:
          - arch: x64
            msystem: UCRT64
            dll_name: BlipBridge-x64.dll
            machine: pei-x86-64
            packages: >-
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-make
            configuration: Release

          - arch: x64
            msystem: UCRT64
            dll_name: BlipBridge-x64.dll
            machine: pei-x86-64
            packages: >-
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-make
            configuration: Debug

          - arch: x86
            msystem: MINGW32
            dll_name: BlipBridge-x86.dll
            machine: pei-i386
            packages: >-
              mingw-w64-i686-gcc
              mingw-w64-i686-cmake
              mingw-w64-i686-make
            configuration: Release

          - arch: x86
            msystem: MINGW32
            dll_name: BlipBridge-x86.dll
            machine: pei-i386
            packages: >-
              mingw-w64-i686-gcc
              mingw-w64-i686-cmake
              mingw-w64-i686-make
            configuration: Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake \
            -S . \
            -B build/${{ matrix.arch }}/${{ matrix.configuration }} \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} \
            -DBLIPBRIDGE_ARCH=${{ matrix.arch }}

      - name: Build
        shell: msys2 {0}
        run: |
          cmake \
            --build build/${{ matrix.arch }}/${{ matrix.configuration }} \
            --parallel

      - name: Locate DLL
        id: dll
        shell: pwsh
        run: |
          $buildDir = "build/${{ matrix.arch }}/${{ matrix.configuration }}"
          $expected = Join-Path $buildDir "${{ matrix.dll_name }}"
          $legacy = Join-Path $buildDir "BlipBridge.dll"

          if (Test-Path $expected) {
              $dll = $expected
          }
          elseif (Test-Path $legacy) {
              Write-Host "Legacy output name detected; normalizing for CI."

              Copy-Item `
                  $legacy `
                  $expected

              $dll = $expected
          }
          else {
              throw "BlipBridge DLL was not produced."
          }

          "path=$dll" >> $env:GITHUB_OUTPUT

          Write-Host "DLL: $dll"

      - name: Verify PE architecture
        shell: msys2 {0}
        run: |
          set -euo pipefail

          dll="${{ steps.dll.outputs.path }}"

          machine=$(
            objdump -f "$dll" |
            grep -o 'pei-i386\|pei-x86-64' |
            head -n 1
          )

          echo "Expected: ${{ matrix.machine }}"
          echo "Actual:   $machine"

          if [ "$machine" != "${{ matrix.machine }}" ]; then
            echo "Architecture mismatch."
            exit 1
          fi

      - name: Test
        shell: msys2 {0}
        run: |
          ctest \
            --test-dir build/${{ matrix.arch }}/${{ matrix.configuration }} \
            --output-on-failure

      - name: Verify exported C ABI
        shell: msys2 {0}
        run: |
          set -euo pipefail

          dll="${{ steps.dll.outputs.path }}"

          exports="$(
            objdump -p "$dll" |
            sed -n '/Export Address Table/,$p'
          )"

          required=(
            BB_Init
            BB_Shutdown
            BB_LoadTexture
            BB_LoadTexturePixels
            BB_ApplyTexture
            BB_ApplyTextureBatch
            BB_ReleaseTexture
            BB_ClearTextures
            BB_GetTextureCount
            BB_GetCapabilities
            BB_GetLastError
            BB_GetVersion
            BB_GetVersionString
            BB_GetAbiVersion
            BB_ApplyPicture
            BB_InvalidateShape
            BB_ClearPictureCache
            BB_GetPictureCacheStats
          )

          for symbol in "${required[@]}"; do
            if ! grep -qE "[[:space:]]${symbol}$" <<< "$exports"; then
              echo "Missing or decorated export: $symbol"
              exit 1
            fi
          done

          echo "All expected exports are present and undecorated."

      - name: Verify VBA wrapper DLL names
        shell: pwsh
        run: |
          $wrapper = Get-Content `
              "vba/BlipBridge.bas" `
              -Raw

          if ($wrapper -notmatch 'BlipBridge-x64\.dll') {
              throw "BlipBridge.bas does not reference BlipBridge-x64.dll."
          }

          if ($wrapper -notmatch 'BlipBridge-x86\.dll') {
              throw "BlipBridge.bas does not reference BlipBridge-x86.dll."
          }

          Write-Host "Wrapper contains both architecture-specific DLL names."

      - name: Upload Release build
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: BlipBridge-windows-${{ matrix.arch }}
          if-no-files-found: error

          path: |
            ${{ steps.dll.outputs.path }}
            vba/BlipBridge.bas
            include/blipbridge/blipbridge.h