name: ci

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: windows-${{ matrix.arch }}-${{ matrix.configuration }}

    runs-on: windows-latest

    strategy:
      fail-fast: false

      # Every combination is spelled out in `include`, with no base matrix keys.
      # That is deliberate: an `include` entry setting a key the base matrix
      # already defines *overwrites* matching combinations instead of adding new
      # ones. With a base `configuration` list these four entries collapsed into
      # two jobs, and x64 silently stopped being built at all.
      matrix:
        include:
          - arch: x64
            backend: windows-office-native
            msystem: UCRT64
            dll_name: BlipBridge-x64.dll
            machine: pei-x86-64
            packages: >-
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-make
            configuration: Release

          - arch: x64
            backend: windows-office-native
            msystem: UCRT64
            dll_name: BlipBridge-x64.dll
            machine: pei-x86-64
            packages: >-
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-make
            configuration: Debug

          - arch: x86
            backend: windows-office-portable
            msystem: MINGW32
            dll_name: BlipBridge-x86.dll
            machine: pei-i386
            packages: >-
              mingw-w64-i686-gcc
              mingw-w64-i686-cmake
              mingw-w64-i686-make
            configuration: Release

          - arch: x86
            backend: windows-office-portable
            msystem: MINGW32
            dll_name: BlipBridge-x86.dll
            machine: pei-i386
            packages: >-
              mingw-w64-i686-gcc
              mingw-w64-i686-cmake
              mingw-w64-i686-make
            configuration: Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake \
            -S . \
            -B build/${{ matrix.arch }}/${{ matrix.configuration }} \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} \
            -DBLIPBRIDGE_ARCH=${{ matrix.arch }}

      - name: Build
        shell: msys2 {0}
        run: |
          cmake \
            --build build/${{ matrix.arch }}/${{ matrix.configuration }} \
            --parallel

      - name: Locate DLL
        id: dll
        shell: pwsh
        run: |
          $buildDir = "build/${{ matrix.arch }}/${{ matrix.configuration }}"
          $expected = Join-Path $buildDir "${{ matrix.dll_name }}"
          $legacy = Join-Path $buildDir "BlipBridge.dll"

          if (Test-Path $expected) {
              $dll = $expected
          }
          elseif (Test-Path $legacy) {
              Write-Host "Legacy output name detected; normalizing for CI."

              Copy-Item `
                  $legacy `
                  $expected

              $dll = $expected
          }
          else {
              throw "BlipBridge DLL was not produced."
          }

          "path=$dll" >> $env:GITHUB_OUTPUT

          Write-Host "DLL: $dll"

      - name: Verify PE architecture
        shell: msys2 {0}
        run: |
          set -euo pipefail

          dll="${{ steps.dll.outputs.path }}"

          machine=$(
            objdump -f "$dll" |
            grep -o 'pei-i386\|pei-x86-64' |
            head -n 1
          )

          echo "Expected: ${{ matrix.machine }}"
          echo "Actual:   $machine"

          if [ "$machine" != "${{ matrix.machine }}" ]; then
            echo "Architecture mismatch."
            exit 1
          fi

      - name: Verify which backend was linked
        shell: msys2 {0}
        run: |
          set -euo pipefail

          # Each backend names itself, and that name is a string in the DLL. It
          # is read back out of the binary rather than out of the configure log
          # on purpose: the log says what CMake decided, the binary says what was
          # actually linked, and the second one is what a user runs.
          #
          # This also pins the release configuration. BB_FORCE_PORTABLE_BACKEND
          # builds the portable backend on x64 so it can be exercised against a
          # real PowerPoint; it must never be what ships, and an x64 DLL naming
          # the portable backend is exactly what that mistake would look like.
          dll="${{ steps.dll.outputs.path }}"
          expected="${{ matrix.backend }}"
          case "$expected" in
            windows-office-native)  forbidden="windows-office-portable" ;;
            windows-office-portable) forbidden="windows-office-native" ;;
            *) echo "Unknown expected backend: $expected"; exit 1 ;;
          esac

          if ! grep -a -F -q -- "$expected" "$dll"; then
            echo "The DLL does not name the $expected backend."
            exit 1
          fi
          if grep -a -F -q -- "$forbidden" "$dll"; then
            echo "The DLL names $forbidden, which must not be linked for ${{ matrix.arch }}."
            exit 1
          fi

          # x86 used to ship a backend that refused everything. It does not any
          # more, and this keeps that from quietly coming back.
          if grep -a -F -q -- "windows-x86-unvalidated" "$dll"; then
            echo "The DLL still contains the refusing backend."
            exit 1
          fi

          echo "Backend linked: $expected"

      - name: Test
        shell: msys2 {0}
        run: |
          ctest \
            --test-dir build/${{ matrix.arch }}/${{ matrix.configuration }} \
            --output-on-failure

      - name: Verify exported C ABI
        shell: msys2 {0}
        run: |
          set -euo pipefail

          dll="${{ steps.dll.outputs.path }}"

          exports="$(
            objdump -p "$dll" |
            sed -n '/Export Address Table/,$p'
          )"

          required=(
            BB_Init
            BB_Shutdown
            BB_LoadTexture
            BB_LoadTexturePixels
            BB_ApplyTexture
            BB_ApplyTextureBatch
            BB_ApplyTextureIfChanged
            BB_ApplyTextureRange
            BB_LoadImage
            BB_LoadImageFromFile
            BB_LoadImagePixels
            BB_GetImageSize
            BB_ReleaseImage
            BB_ClearImages
            BB_GetImageCount
            BB_CreateTextureFromImage
            BB_WarpImageQuad
            BB_ApplyImageQuad
            BB_LoadTextureEx
            BB_LoadTextureFromFileEx
            BB_ReleaseTexture
            BB_ClearTextures
            BB_GetTextureCount
            BB_GetCapabilities
            BB_GetLastError
            BB_GetVersion
            BB_GetVersionString
            BB_GetAbiVersion
            BB_ApplyPicture
            BB_InvalidateShape
            BB_ClearPictureCache
            BB_GetPictureCacheStats
            BB_LoadTexturePixelsScaled
          )

          for symbol in "${required[@]}"; do
            if ! grep -qE "[[:space:]]${symbol}$" <<< "$exports"; then
              echo "Missing or decorated export: $symbol"
              exit 1
            fi
          done

          echo "All expected exports are present and undecorated."

      - name: Verify VBA wrapper DLL names
        shell: pwsh
        run: |
          $wrapper = Get-Content `
              "vba/BlipBridge.bas" `
              -Raw

          if ($wrapper -notmatch 'BlipBridge-x64\.dll') {
              throw "BlipBridge.bas does not reference BlipBridge-x64.dll."
          }

          if ($wrapper -notmatch 'BlipBridge-x86\.dll') {
              throw "BlipBridge.bas does not reference BlipBridge-x86.dll."
          }

          Write-Host "Wrapper contains both architecture-specific DLL names."

          # The ABI version the wrapper expects must match the header it ships
          # beside, or a user gets a loud mismatch at Initialize for no reason.
          $header = Get-Content "include/blipbridge/blipbridge.h" -Raw
          if ($header -notmatch '#define\s+BB_ABI_VERSION\s+(\d+)u') {
              throw "Could not read BB_ABI_VERSION from the public header."
          }
          $headerAbi = $Matches[1]

          if ($wrapper -notmatch 'BB_EXPECTED_ABI\s+As\s+Long\s+=\s+(\d+)') {
              throw "Could not read BB_EXPECTED_ABI from BlipBridge.bas."
          }
          $wrapperAbi = $Matches[1]

          if ($headerAbi -ne $wrapperAbi) {
              throw "ABI mismatch: header says $headerAbi, BlipBridge.bas expects $wrapperAbi."
          }

          Write-Host "Wrapper and header agree on ABI version $headerAbi."

          <#
            ABI 4 is the version that introduced BB_ApplyTextureRange and the
            capability bit that advertises it. A build claiming ABI 4 without
            both would tell a caller the range path exists and then not export
            it, so the three are checked together rather than trusted to move
            together.
          #>
          if ([int]$headerAbi -ge 4) {
              foreach ($required in @('BB_ApplyTextureRange', 'BB_CAP_RANGE_APPLY')) {
                  if ($header -notmatch [regex]::Escape($required)) {
                      throw "ABI $headerAbi header is missing $required."
                  }
              }

              if ($header -notmatch '#define\s+BB_CAP_RANGE_APPLY\s+0x0100u') {
                  throw "BB_CAP_RANGE_APPLY must be 0x0100u."
              }

              foreach ($required in @('ApplyTextureRange', 'BB_CAP_RANGE_APPLY')) {
                  if ($wrapper -notmatch [regex]::Escape($required)) {
                      throw "BlipBridge.bas is missing $required."
                  }
              }

              Write-Host "ABI $headerAbi exposes BB_ApplyTextureRange and BB_CAP_RANGE_APPLY."
          }

          <#
            ABI 5 added the CPU image resource and the quad warp. Same reasoning
            as above: a build claiming 5 without them would advertise a
            capability and then not export it.
          #>
          if ([int]$headerAbi -ge 5) {
              foreach ($required in @('BB_LoadImage', 'BB_WarpImageQuad', 'BB_ApplyImageQuad',
                                      'BB_LoadTextureEx', 'BB_CAP_IMAGE_PIPELINE',
                                      'BB_ImageRequest', 'BB_PointF')) {
                  if ($header -notmatch [regex]::Escape($required)) {
                      throw "ABI $headerAbi header is missing $required."
                  }
              }

              if ($header -notmatch '#define\s+BB_CAP_IMAGE_PIPELINE\s+0x0200u') {
                  throw "BB_CAP_IMAGE_PIPELINE must be 0x0200u."
              }

              foreach ($required in @('LoadImage', 'LoadImageProcessed', 'WarpImageQuad', 'ApplyImageQuad',
                                      'LoadTextureScaled', 'BlipBridgeImage',
                                      'BlipBridgePoint', 'BB_CAP_IMAGE_PIPELINE')) {
                  if ($wrapper -notmatch [regex]::Escape($required)) {
                      throw "BlipBridge.bas is missing $required."
                  }
              }

              Write-Host "ABI $headerAbi exposes the image pipeline and BB_CAP_IMAGE_PIPELINE."
          }

          <#
            The public API must stay strongly typed. Object and Variant in a
            public signature would compile and then quietly undo the typing, so
            it is checked here rather than left to review.
          #>
          $publicLines = $wrapper -split "`r?`n" | Where-Object {
              $_ -match '^\s*Public\s+(Function|Sub)\s'
          }

          foreach ($line in $publicLines) {
              if ($line -match '\bAs\s+Object\b') {
                  throw "Public API still uses Object: $line"
              }
              if ($line -match '\bAs\s+Variant\b') {
                  throw "Public API still uses Variant: $line"
              }
          }

          foreach ($name in @('BlipBridgeTexture', 'BlipBridgeScaleFilter',
                              'LoadTexturePixelsScaled', 'PowerPoint.ShapeRange')) {
              if ($wrapper -notmatch [regex]::Escape($name)) {
                  throw "BlipBridge.bas is missing $name."
              }
          }

          Write-Host "Public API is strongly typed and exposes the scaling surface."

      - name: Check the VBA module compiles by the rules we can check
        shell: pwsh
        run: ./tools/check_vba_module.ps1

      - name: Upload Release build
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: BlipBridge-windows-${{ matrix.arch }}
          if-no-files-found: error

          path: |
            ${{ steps.dll.outputs.path }}
            vba/BlipBridge.bas
            include/blipbridge/blipbridge.h

  portable-backend:
    name: portable-backend-on-x64
    runs-on: windows-latest

    # The portable backend is what 32-bit PowerPoint runs, and it is validated by
    # being built on x64 and driven against a real PowerPoint by the Office
    # harnesses. That only works while this configuration still compiles, and it is
    # not the configuration anything ships, so nothing else would notice it
    # breaking. This leg notices.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      - name: Configure with the portable backend forced
        shell: msys2 {0}
        run: |
          cmake             -S .             -B build/portable             -G "MinGW Makefiles"             -DCMAKE_BUILD_TYPE=Release             -DBB_FORCE_PORTABLE_BACKEND=ON

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build/portable --parallel

      - name: Test
        shell: msys2 {0}
        run: |
          ctest --test-dir build/portable --output-on-failure

      - name: Verify it really is the portable backend
        shell: msys2 {0}
        run: |
          set -euo pipefail

          # The override has to actually take effect, or this leg would pass
          # while testing the accelerated backend a second time.
          for dll in build/portable/BlipBridge-x64.dll build/portable/BlipBridgeResearch-x64.dll; do
            if ! grep -a -F -q -- "windows-office-portable" "$dll"; then
              echo "$dll does not name the portable backend."
              exit 1
            fi
            if grep -a -F -q -- "windows-office-native" "$dll"; then
              echo "$dll still names the accelerated backend."
              exit 1
            fi
          done

          echo "The portable backend is what was built, including into the research surface."
